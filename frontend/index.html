<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lapalfa Support</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="chat-header">

        <div class="bot-avatar-wrap">
            <div class="bot-avatar">L</div>
            <span class="online-dot"></span>
        </div>

        <div class="header-content">
            <h2>Lapalfa Support</h2>
            <span class="status-text">● Online · Typically replies instantly</span>
        </div>

    </div>


    <!-- CHAT -->

    <div id="chat-box" class="chat-box">

        <div class="message-row bot">

            <div class="message-avatar">L</div>

            <div class="message bot-message">
                Hello! 👋 Welcome to <strong>Lapalfa Support</strong>.<br><br>
                How can I help you today?
            </div>

        </div>

    </div>


    <!-- QUICK ACTIONS -->

    <div class="quick-actions">

        <button class="quick-btn" onclick="quickMessage('How much does shipping cost?')">
            🚚 Shipping
        </button>

        <button class="quick-btn" onclick="quickMessage('How can I track my order?')">
            📦 Track Order
        </button>

        <button class="quick-btn" onclick="quickMessage('What is your return policy?')">
            ↩️ Returns
        </button>

        <button class="quick-btn" onclick="quickMessage('Laptop Battery')">
            🔋 Laptop Battery
        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="message-input"
            placeholder="Ask about batteries, shipping, returns…"
            autocomplete="off"
        >

        <button id="send-button" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
